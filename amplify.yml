version: 1
applications:
  - appRoot: my-app
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || true
            - npm ci --legacy-peer-deps
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
